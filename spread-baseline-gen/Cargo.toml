[package]
name = "spread-baseline-gen"
version = "0.1.0"
edition = "2024"

[dependencies]
# `postgres-storage`, NOT the default `redb-storage`: ReDB takes an exclusive
# file lock for the process's lifetime, so this generator could not run while a
# replay or a strategy crate held the cache. Postgres is multi-process and is
# the warm shared table the rest of the repo already fills.
candle-cache = { version = "0.1.2", path = "../../candle-cache", default-features = false, features = ["postgres-storage"] }
candle-model = { version = "0.1.0", path = "../../candle-model" }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
instrument-lookup = { version = "0.5.0", path = "../../instrument-lookup" }
oanda-client = { version = "0.4.0", path = "../../oanda-client" }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tradenation-api = { git = "https://github.com/matiu2/tradenation-api.git", tag = "broker-tradenation-v0.20.0", version = "0.7.0" }
