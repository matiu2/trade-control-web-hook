[package]
name = "adaptive-risk"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
color-eyre = "0.6.5"
fs2 = "0.4.3"
rand = "0.10.3"
rand_chacha = "0.10.0"
rust_decimal = { version = "1.43", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tracing = "0.1.44"

[workspace]

[dev-dependencies]
tempfile = "3.27.0"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
