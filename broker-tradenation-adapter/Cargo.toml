[package]
name = "broker-tradenation-adapter"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-puller = { path = "../candle-puller" }
color-eyre = "0.6"
broker-tradenation = { git = "https://github.com/matiu2/tradenation-api.git", rev = "00e1e65", version = "0.12.0" }
candle-model = { version = "0.1.0", path = "../../candle-model" }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
trade-control-core = { version = "0.1.0", path = "../core" }
tradenation-api = { git = "https://github.com/matiu2/tradenation-api.git", rev = "00e1e65", version = "0.8.3" }

[dev-dependencies]
serde_json = "1.0"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
