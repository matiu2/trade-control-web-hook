[package]
name = "broker-ctrader"
version = "0.1.0"
edition = "2024"

[dependencies]
trade-control-core = { path = "../core" }
ctrader-api = { path = "../../ctrader-api" }
chrono = "0.4.45"
color-eyre = "0.6.5"
serde_json = "1.0.151"
tracing = "0.1.44"
tokio = { version = "1.53.2", features = ["time", "sync"] }
ctrader-fix = { version = "0.1.0", path = "../../ctrader-fix" }
serde = { version = "1.0.229", features = ["derive"] }
libc = "0.2.191"
toml = "1.1.6"
candle-cache = { version = "0.1.2", path = "../../candle-cache", features = ["ctrader"] }
ctrader-data-source = { version = "0.1.0", path = "../../ctrader-data-source" }
candle-model = { version = "0.1.0", path = "../../candle-model" }
instrument-lookup = { version = "0.7.0", path = "../../instrument-lookup", default-features = false }
adaptive-risk = { version = "0.1.0", path = "../adaptive-risk" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
