[workspace]
resolver = "3"
members = ["broker-ibkr", "broker-oanda", "broker-tradenation-adapter", "cli", "conventions", "core", "engine", "engine-v2", "journal", "market-hours-gen", "news-sentiment-tv", "contract-calendar-gen", "spread-baseline-gen", "trade-control-cron", "trade-control-types-v2", "trading-view", "tv-arm", "tv-news", "worker"]

# `tradenation-api` is consumed as a git dep by workspace members (`worker`,
# `cli`, `tv-arm`, …); its `ohlcv` module exposes `candle_model::Granularity` /
# `CandleData` from a candle-model vendored inside that git checkout. Members
# also depend on the local `candle-model`. Without this patch the two are
# distinct crates and the types don't unify (E0308). Redirect the git-sourced
# candle-model to the same local path so there is one crate.
[patch."https://github.com/matiu2/tradenation-api.git"]
candle-model = { path = "../candle-model" }

# `tradenation-api` (a git dep) depends on `instrument-lookup` by git tag, since a
# git-sourced crate cannot path-dep outside its repo. Members path-dep the local
# `instrument-lookup`. Same problem as candle-model above: redirect the git
# source to the local path so there is ONE crate — and one session `Anchor` type
# shared by candle-cache, oanda-client and the TradeNation aggregator.
[patch."https://github.com/matiu2/instrument-lookup.git"]
instrument-lookup = { path = "../instrument-lookup" }
